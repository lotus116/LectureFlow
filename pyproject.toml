[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lectureflow"
version = "0.6.4"
description = "Local-first macOS classroom assistant"
requires-python = ">=3.11"
dependencies = ["imageio-ffmpeg==0.6.0", "pypdf>=6,<7", "olefile>=0.47,<0.48", "psutil>=6,<8; sys_platform == 'win32'"]

[project.optional-dependencies]
models = ["mlx-qwen3-asr==0.4.4; sys_platform == 'darwin'", "mlx-lm>=0.30,<0.32; sys_platform == 'darwin'"]
dev = ["pytest>=8,<9", "ruff>=0.14,<0.15", "numpy>=2,<3"]
windows = ["faster-whisper>=1.2,<2", "transformers>=4.45,<5; sys_platform == 'win32'", "torch>=2.6,<3", "sentencepiece>=0.2,<0.3", "sacremoses>=0.1,<0.2", "sounddevice>=0.5,<0.6"]

[project.scripts]
lectureflow = "lectureflow.cli:main"
lectureflow-windows = "lectureflow.windows:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lectureflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.uv]
conflicts = [[{ extra = "models" }, { extra = "windows" }]]
