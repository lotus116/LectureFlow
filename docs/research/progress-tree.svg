<text x="69" y="454" font-size="17" fill="#172d43" font-weight="700">最新一行怎样保持可见？</text>
<text x="69" y="477" font-size="16" fill="#243b52" font-weight="500">锚底能保住末行，仍会移动视口</text>
<text x="69" y="498" font-size="15" fill="#4d637a" font-weight="400">原型保留，默认不变</text>
<path d="M42 579H55" fill="none" stroke="#255b99" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
