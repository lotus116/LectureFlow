<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="776" viewBox="0 0 1120 776" role="img" aria-labelledby="title desc">
<title id="title">LectureFlow 从 proposal 展开的研究进度树</title>
<desc id="desc">课中字幕与课后重听是两条主线；现场与 Zoom、术语去噪、讲师微调为探索分支。底部列课中字幕关键事实验证。图后有可读文字版。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="0" y="0" width="1120" height="776" rx="22" fill="#f3f6fa" stroke="none"/>
<text x="32" y="38" font-size="15" fill="#405972" font-weight="700">LECTUREFLOW   /   NLP 期末研究</text>
<text x="861" y="38" font-size="15" fill="#405972" font-weight="600">2026-11-26  ·  C28 / L06</text>
<rect x="318" y="58" width="484" height="90" rx="17" fill="#10263d" stroke="none"/>
