<text x="438" y="555" font-size="13" fill="#84510c" font-weight="700">待验</text>
<text x="431" y="582" font-size="17" fill="#172d43" font-weight="700">真实远场课堂能否复现？</text>
<text x="431" y="605" font-size="16" fill="#243b52" font-weight="500">既有课堂 5/8 轨已满覆盖</text>
<text x="431" y="626" font-size="15" fill="#4d637a" font-weight="400">会议代理不等同真实课堂</text>
