<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="386" viewBox="0 0 1060 386" role="img" aria-labelledby="title desc">
<title id="title">LectureFlow: classroom input and selective re-listening</title><desc id="desc">Panel A: room English word error rate dropped from 19.45 to 14.63 percent after full re-listening, Zoom from 11.72 to 10.21. Panel B: matched same-window room re-listening gives 37.2 fewer errors by random selection, 66 by revision-priority, and 95 by full re-listening; relative compute is approximately 39, 39, and 100 percent.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#142b40}.title{font-size:24px;font-weight:700}.panel{font-size:18px;font-weight:700}.body{font-size:14px}.note{font-size:13px;fill:#465a6c}.axis{font-size:12px;fill:#465a6c}.metric{font-size:14px;font-weight:700}.grid{stroke:#d9e3ed;stroke-width:1}.divider{stroke:#dae5ef;stroke-width:1}.room{stroke:#00786e;stroke-width:3}.zoom{stroke:#405da6;stroke-width:3}.base{stroke:#91a3b5;stroke-width:1.2}.stem{stroke:#9eacba;stroke-width:1;stroke-dasharray:4 3}</style>
<rect width="1060" height="386" fill="#ffffff"/><text x="25" y="34" class="title" >What helps on real classroom recordings?</text><text x="25" y="55" class="note" >Four aligned excerpts from two courses · 20.2 source minutes · fixed English recognition model</text><line x1="531" y1="76" x2="531" y2="337" class="divider"/><text x="25" y="93" class="panel" >A  ·  Audio source and full re-listening</text><text x="25" y="115" class="note" >Word error rate on 2,262 shared reference words</text><line x1="100" y1="143" x2="100" y2="297" class="grid"/><text x="100" y="317" class="axis" text-anchor="middle">0%</text><line x1="175" y1="143" x2="175" y2="297" class="grid"/><text x="175" y="317" class="axis" text-anchor="middle">5%</text><line x1="250" y1="143" x2="250" y2="297" class="grid"/><text x="250" y="317" class="axis" text-anchor="middle">10%</text><line x1="325" y1="143" x2="325" y2="297" class="grid"/><text x="325" y="317" class="axis" text-anchor="middle">15%</text><line x1="400" y1="143" x2="400" y2="297" class="grid"/><text x="400" y="317" class="axis" text-anchor="middle">20%</text><text x="25" y="189" class="body" >Room</text><line x1="319.49602122015915" y1="184" x2="391.7771883289124" y2="184" class="room"/><circle cx="391.7771883289124" cy="184" r="6.5" fill="#00786e"/><circle cx="319.49602122015915" cy="184" r="6.5" fill="#00786e"/><text x="391.7771883289124" y="171" class="metric" text-anchor="middle">19.45%</text><text x="319.49602122015915" y="207" class="metric" text-anchor="middle">14.63%</text><text x="25" y="253" class="body" >Zoom</text><line x1="253.18302387267906" y1="248" x2="275.7294429708223" y2="248" class="zoom"/><circle cx="275.7294429708223" cy="248" r="6.5" fill="#405da6"/><circle cx="253.18302387267906" cy="248" r="6.5" fill="#405da6"/><text x="275.7294429708223" y="235" class="metric" text-anchor="middle">11.72%</text><text x="253.18302387267906" y="271" class="metric" text-anchor="middle">10.21%</text><text x="25" y="340" class="note" >Upper label: streaming draft. Lower label: independently cut offline draft.</text><text x="557" y="93" class="panel" >B  ·  Which room captions should we re-listen to?</text><text x="557" y="115" class="note" >Net word errors removed using the same caption boundaries</text><line x1="613" y1="297" x2="995" y2="297" class="grid"/><text x="603" y="301" class="axis" text-anchor="end">0</text><line x1="613" y1="260.75" x2="995" y2="260.75" class="grid"/><text x="603" y="264.75" class="axis" text-anchor="end">25</text><line x1="613" y1="224.5" x2="995" y2="224.5" class="grid"/><text x="603" y="228.5" class="axis" text-anchor="end">50</text><line x1="613" y1="188.25" x2="995" y2="188.25" class="grid"/><text x="603" y="192.25" class="axis" text-anchor="end">75</text><line x1="613" y1="152" x2="995" y2="152" class="grid"/><text x="603" y="156" class="axis" text-anchor="end">100</text><text x="613" y="317" class="axis" text-anchor="middle">0%</text><text x="708.5" y="317" class="axis" text-anchor="middle">25%</text><text x="804" y="317" class="axis" text-anchor="middle">50%</text><text x="899.5" y="317" class="axis" text-anchor="middle">75%</text><text x="995" y="317" class="axis" text-anchor="middle">100%</text><line x1="761.9806648720086" y1="243.06966666666668" x2="761.9806648720086" y2="297" class="stem"/><circle cx="761.9806648720086" cy="243.06966666666668" r="6.5" fill="#768ba0"/><text x="773.9806648720086" y="260.06966666666665" class="metric" >Random mean: 37.2</text><line x1="762.3935500208258" y1="201.3" x2="762.3935500208258" y2="297" class="stem"/><circle cx="762.3935500208258" cy="201.3" r="6.5" fill="#00786e"/><text x="774.3935500208258" y="189.3" class="metric" >Revision priority: 66</text><line x1="995" y1="159.25" x2="995" y2="297" class="stem"/><circle cx="995" cy="159.25" r="6.5" fill="#142b40"/><text x="982" y="147.25" class="metric" text-anchor="end">Full: 95</text><text x="557" y="340" class="note" >Warm decode cost relative to re-listening to every original caption window</text><line x1="25" y1="353" x2="1035" y2="353" class="divider"/><text x="25" y="373" class="note" >A and B use different offline chunking/coverage. Paired pilot; alternate audio sources are not independent excerpts.</text></svg>
