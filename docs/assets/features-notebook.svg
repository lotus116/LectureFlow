<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="334" viewBox="0 0 1200 334" role="img" aria-labelledby="title"><title id="title">LectureFlow 六项功能：英语识别与中文翻译、实时与悬浮字幕、共享资料、录音与导入、转写编辑导出、本机处理。</title><rect width="1200" height="334" rx="16" fill="#fff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}</style>
<g transform="translate(8 17)"><rect x="0" y="0" width="68" height="68" rx="20" fill="#edf6fd"/><g transform="translate(8 8)" fill="none" stroke="#244974" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="9" width="16" height="25" rx="8"/><path d="M10 26v2a14 14 0 0 0 28 0v-2M24 42v7M16 49h16"/></g><text x="86" y="24" font-size="22" font-weight="650" fill="#17364e">英语识别与中文翻译</text><text x="86" y="60" font-size="18" fill="#446179">识别英语课堂内容，</text><text x="86" y="88" font-size="18" fill="#446179">实时翻译为简体中文。</text></g>
<g transform="translate(408 17)"><rect x="0" y="0" width="68" height="68" rx="20" fill="#edf6fd"/><g transform="translate(8 8)" fill="none" stroke="#244974" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="38" height="28" rx="6"/><path d="M22 22c-7-7-14 8-4 9M38 22c-7-7-14 8-4 9"/></g><text x="86" y="24" font-size="22" font-weight="650" fill="#17364e">实时双语与悬浮字幕</text><text x="86" y="60" font-size="18" fill="#446179">中英对照，悬浮置顶；</text><text x="86" y="88" font-size="18" fill="#446179">主窗口可展开字幕阅读。</text></g>
<g transform="translate(808 17)"><rect x="0" y="0" width="68" height="68" rx="20" fill="#edf6fd"/><g transform="translate(8 8)" fill="none" stroke="#244974" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6h20l10 10v34H12ZM32 6v12h10M20 29h14M20 37h14"/></g><text x="86" y="24" font-size="22" font-weight="650" fill="#17364e">课程资料统一使用</text><text x="86" y="60" font-size="18" fill="#446179">PDF / PPT 归属课程，</text><text x="86" y="88" font-size="18" fill="#446179">所有 Lecture 共享资料。</text></g>
<g transform="translate(8 181)"><rect x="0" y="0" width="68" height="68" rx="20" fill="#edf6fd"/><g transform="translate(8 8)" fill="none" stroke="#244974" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="27" r="20"/><circle cx="26" cy="27" r="10"/></g><text x="86" y="24" font-size="22" font-weight="650" fill="#17364e">录音、暂停与继续</text><text x="86" y="60" font-size="18" fill="#446179">暂停后继续，也能追加录制，</text><text x="86" y="88" font-size="18" fill="#446179">或导入已有音频。</text></g>
<g transform="translate(408 181)"><rect x="0" y="0" width="68" height="68" rx="20" fill="#edf6fd"/><g transform="translate(8 8)" fill="none" stroke="#244974" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 12H9v36h33V29M23 29l20-20 7 7-20 20-10 3Z"/></g><text x="86" y="24" font-size="22" font-weight="650" fill="#17364e">课后转写编辑导出</text><text x="86" y="60" font-size="18" fill="#446179">搜索、修改与重新翻译；</text><text x="86" y="88" font-size="18" fill="#446179">TXT / Markdown / SRT / JSON。</text></g>
<g transform="translate(808 181)"><rect x="0" y="0" width="68" height="68" rx="20" fill="#edf6fd"/><g transform="translate(8 8)" fill="none" stroke="#244974" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="7" width="34" height="30" rx="3"/><path d="M5 43h42M18 37l-2 6M34 37l2 6"/></g><text x="86" y="24" font-size="22" font-weight="650" fill="#17364e">课堂处理留在本机</text><text x="86" y="60" font-size="18" fill="#446179">模型准备完成后，</text><text x="86" y="88" font-size="18" fill="#446179">课堂处理可离线运行。</text></g>
</svg>
