plugins { id 'com.android.application' }
android {
    namespace 'local.lectureflow.validation'
    compileSdk 35
    ndkVersion '28.2.13676358'
    signingConfigs { debug { storeFile file('../../.tools/android-build/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    defaultConfig {
        applicationId 'local.lectureflow.validation'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1-validation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    implementation files('libs/sherpa-onnx-2.0.1.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
